<!DOCTYPE html>
<html lang="en">
<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <title>Employee Registration Form</title>
</head>
<body>
	<fieldset>
	<legend><h1>Employee Registration Form</h1></legend>
	<form action="#" method="post">
		
			<label for="firstName">First Name</label>
			<input type="text" name="firstName" required>
			<br>
			<br>
	
			<label for="lastName">Last Name</label>
			<input type="text" name="lastName" required>
			<br>
			<br>
	
			<label for="email">Email</label>
			<input type="email" name="email" required>
			<br>
			<br>
	
	
			<label for="gender">Gender</label>
			<select name="gender" required>
				<option value="">Select Gender</option>
				<option value="male">Male</option>
				<option value="female">Female</option>
				<option value="other">Other</option>
			</select>
			<br>
			<br>

	
			<label for="age">Age</label>
			<input type="number" name="age" min="18" max="50" required>
			<br>
			<br>
	
			<label for="city">City</label>
			<input list="cities" name="city" required>
			<datalist id="cities">
				<option value="Jaipur"></option>
				<option value="Sikar"></option>
				<option value="Udaipur"></option>
				<option value="Ganganagar"></option>
				<option value="Kota"></option>
				<option value="Bikaner"></option>
				<option value="Jodhpur"></option>
			</datalist>
			<br>
			<br>
	
			<label for="resume">Upload Your Resume</label>
			<input type="file" name="resume" accept=".pdf,.doc,.docx" required>
			<br>
			<br>
	
			<label for="position">Applying For</label>
			<input list="positions" name="position" required>
			<datalist id="positions">
				<option value="Software Developer"></option>
				<option value="Business Analyst"></option>
				<option value="Data Scientist"></option>
				<option value="DevOps Engineer"></option>
				<option value="Java Developer"></option>
				<option value="Python Developer"></option>
				<option value="Senior Developer"></option>
				<option value="Machine Learning Developer"></option>
			</datalist>
			<br>
			<br>
	
			<label for="department">Department</label>
			<select name="department" required>
				<option value="">Select Department</option>
				<option value="HR">HR</option>
				<option value="IT">Information Technology</option>
				<option value="Finance">Finance</option>
				<option value="Marketing">Marketing</option>
				<option value="Sales">Sales</option>
			</select>
			<br>
			<br>
	
			<label for="joiningDate">Joining Date</label>
			<input type="date" name="joiningDate" required>
			<br>
			<br>
	
			<button type="submit">Submit</button>  
	
	</form>  
</fieldset>
</body>
</html>

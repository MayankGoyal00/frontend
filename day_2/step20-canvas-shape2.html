<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Canvas with Shapes</title>
    <style>
        canvas{
            border: 1px solid gray;
            display: block;
            margin: auto;
        }
    </style>
    <script>
    window.onload = function(){
        var ctx = document.getElementsByTagName("canvas")[0].getContext("2d");
        ctx.strokeStyle = "green";
        ctx.fillStyle = "black";
        ctx.lineWidth = 5;
        ctx.moveTo(100,100);
        ctx.lineTo(100,200);
        ctx.lineTo(200,200);
        ctx.lineTo(200,100);

        ctx.moveTo(200,0);
        ctx.lineTo(200,100);
        ctx.lineTo(300,100);
        ctx.lineTo(300,0);
        ctx.lineTo(200,0);

        ctx.moveTo(300,100);
        ctx.lineTo(300,200);
        ctx.lineTo(400,200);
        ctx.lineTo(400,100);
        ctx.lineTo(300,100);

        ctx.moveTo(400,0);
        ctx.lineTo(400,100);
        ctx.lineTo(500,100);
        ctx.lineTo(500,0);
        ctx.lineTo(400,0);

        ctx.moveTo(0,0);
        ctx.lineTo(0,100);
        ctx.lineTo(100,100);
        ctx.lineTo(100,0);
        ctx.lineTo(0,0);

        ctx.moveTo(0,200);
        ctx.lineTo(0,300);
        ctx.lineTo(100,300);
        ctx.lineTo(100,200);
        ctx.lineTo(0,200);

        ctx.moveTo(200,200);
        ctx.lineTo(200,300);
        ctx.lineTo(300,300);
        ctx.lineTo(300,200);
        ctx.lineTo(200,200);

        ctx.moveTo(400,200);
        ctx.lineTo(400,300);
        ctx.lineTo(500,300);
        ctx.lineTo(500,200);
        ctx.lineTo(400,200);

        ctx.moveTo(100,300);
        ctx.lineTo(100,400);
        ctx.lineTo(200,400);
        ctx.lineTo(200,300);
        ctx.lineTo(100,300);

        ctx.moveTo(300,300);
        ctx.lineTo(300,400);
        ctx.lineTo(400,400);
        ctx.lineTo(400,300);
        ctx.lineTo(300,300);

        ctx.moveTo(0,400);
        ctx.lineTo(0,500);
        ctx.lineTo(100,500);
        ctx.lineTo(100,400);
        ctx.lineTo(0,400);

        ctx.moveTo(200,400);
        ctx.lineTo(200,500);
        ctx.lineTo(300,500);
        ctx.lineTo(300,400);
        ctx.lineTo(200,400);

        ctx.moveTo(400,400);
        ctx.lineTo(400,500);
        ctx.lineTo(500,500);
        ctx.lineTo(500,400);
        ctx.lineTo(400,400);



        ctx.closePath();
        ctx.stroke();
        ctx.fill();
    }
    </script>
</head>
<body>
    <canvas width="500" height="500"></canvas>
</body>
</html>
